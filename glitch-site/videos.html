<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Vidéos — Dr. Arobase</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .wrap{max-width:1100px;margin:0 auto;padding:32px 16px}
    .top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
    .top a{color:var(--accent);text-decoration:none;font-weight:600}
    .glitch{font-size:2.4rem}
    .lead{color:var(--muted);margin:8px 0 28px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
    .card{background:var(--panel);border:1px solid rgba(88,166,255,0.15);border-radius:14px;overflow:hidden;transition:transform .2s,border-color .2s,box-shadow .2s}
    .card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 10px 30px rgba(88,166,255,0.15)}
    .card video{display:block;width:100%;aspect-ratio:9/16;object-fit:cover;background:#000}
    .card h2{margin:0;padding:12px 16px;font-size:1rem;display:flex;justify-content:space-between;align-items:center}
    .card h2 a{color:var(--muted);font-size:.8rem;font-weight:400;text-decoration:none}
    .card h2 a:hover{color:var(--accent)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1 class="glitch" data-glitch="Vidéos">Vidéos</h1>
      <a href="index.html">← Retour au site</a>
    </div>
    <p class="lead">Une vidéo à la fois : lancer une vidéo met les autres en pause.</p>

    <div class="grid">
      <article class="card">
        <video controls playsinline preload="metadata" poster="../assets/previews/kobeni_dance.jpg">
          <source src="../assets/videos/kobeni_dance.mp4" type="video/mp4" />
          Votre navigateur ne supporte pas la balise vidéo.
        </video>
        <h2>Danse <a href="../assets/videos/kobeni_dance.mp4" download>Télécharger</a></h2>
      </article>

      <article class="card">
        <video controls playsinline preload="metadata" poster="../assets/previews/kobeni_acceuil.jpg">
          <source src="../assets/videos/kobeni_acceuil.mp4" type="video/mp4" />
          Votre navigateur ne supporte pas la balise vidéo.
        </video>
        <h2>Accueil <a href="../assets/videos/kobeni_acceuil.mp4" download>Télécharger</a></h2>
      </article>

      <article class="card">
        <video controls playsinline preload="metadata" poster="../assets/previews/kobeni_pochita.jpg">
          <source src="../assets/videos/kobeni_pochita.mp4" type="video/mp4" />
          Votre navigateur ne supporte pas la balise vidéo.
        </video>
        <h2>Pochita <a href="../assets/videos/kobeni_pochita.mp4" download>Télécharger</a></h2>
      </article>
    </div>
  </div>

  <footer class="foot">Made with ❤️ — Dr. Arobase</footer>

  <script>
    // Pause the other videos when one starts playing
    const videos = document.querySelectorAll('video');
    videos.forEach(v => v.addEventListener('play', () => {
      videos.forEach(o => { if (o !== v) o.pause(); });
    }));
  </script>
</body>
</html>
