<svg xmlns='http://www.w3.org/2000/svg' width='900' height='140' viewBox='0 0 900 140' preserveAspectRatio='xMidYMid meet'>
  <rect width='100%' height='100%' fill='#071024' rx='8'/>
  <defs>
    <style type='text/css'><![CDATA[
      .gtext{font-family:Inter, Arial, Helvetica, sans-serif;font-weight:800;font-size:48px;letter-spacing:6px}
    ]]></style>
  </defs>
  <g transform='translate(40,90)'>
    <!-- cyan layer -->
    <text class='gtext' fill='#00f5ff' opacity='0.8'>
      <tspan id='c1'>@dr.arobase</tspan>
      <animateTransform attributeName='transform' type='translate' values='0 0; -6 4; 6 -3; 0 0' dur='0.7s' repeatCount='indefinite'/>
    </text>
    <!-- magenta layer -->
    <text class='gtext' fill='#ff00d0' opacity='0.75'>
      <tspan id='m1'>@dr.arobase</tspan>
      <animateTransform attributeName='transform' type='translate' values='0 0; 5 -4; -5 3; 0 0' dur='0.85s' repeatCount='indefinite' begin='0.15s'/>
    </text>
    <!-- white base -->
    <text class='gtext' fill='#ffffff' opacity='1'>
      <tspan id='w1'>@dr.arobase</tspan>
    </text>
    <!-- glitch slices (rect masks) -->
    <g>
      <rect x='-40' y='-40' width='1000' height='18' fill='rgba(255,255,255,0.01)'>
        <animate attributeName='x' values='-40;-28;-40' dur='1.1s' repeatCount='indefinite'/>
      </rect>
      <rect x='-40' y='-6' width='1000' height='12' fill='rgba(255,255,255,0.02)'>
        <animate attributeName='x' values='-40;16;-12; -40' dur='0.9s' repeatCount='indefinite'/>
      </rect>
    </g>
  </g>
</svg>